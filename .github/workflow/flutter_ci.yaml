name: Flutter CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest # <-- !!! 중요 !!! 리눅스(ubuntu) 대신 macOS로 변경

    steps:
      - uses: actions/checkout@v4

      # macOS에서는 Java 설치가 필요 없을 수 있습니다. (macOS에 기본 포함)
      # 혹시 안 된다면 setup-java를 다시 추가해주세요.

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test

      # (8) APK 대신 macOS용 .app 파일 빌드 (Flutter Desktop)
      # macOS용 빌드는 --release 플래그가 필요 없을 수 있습니다.
      # Dart Define도 Prod로 설정합니다.
      - name: Build macOS App
        run: flutter build macos --dart-define=FLAVOR=prod --no-codesign # --no-codesign은 개발 빌드용

      # (9) 결과물(.app) 업로드
      - name: Upload macOS App
        uses: actions/upload-artifact@v4
        with:
          name: app-release-macos
          # macOS 빌드 결과물은 이 경로에 있습니다.
          path: build/macos/Build/Products/Release/Flutter Lab.app